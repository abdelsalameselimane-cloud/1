<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدينة افتراضية عند الغروب</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140e1c}
canvas{display:block;touch-action:none}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#fff;font:14px system-ui,sans-serif;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:8px;pointer-events:none;text-align:center;max-width:90vw}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hint">اسحب بالماوس للنظر · W A S D للحركة · Shift للجري · زر ENTER VR للواقع الافتراضي</div>
<script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const V3=THREE.Vector3,UP=new V3(0,1,0);

/* ---------- Renderer / Scene / Rig ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.9;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.xr.enabled=true;
document.body.append(R.domElement,VRButton.createButton(R));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);cam.position.y=1.6;
const rig=new THREE.Group();rig.position.set(0,0,100);rig.add(cam);scene.add(rig);

/* ---------- Procedural textures (color + normal + roughness) ---------- */
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const noise=(w,base,v,grid)=>cv(w,w,g=>{const d=g.createImageData(w,w);for(let i=0;i<w*w;i++){const n=base+(rnd()-.5)*v;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=n;d.data[i*4+3]=255}g.putImageData(d,0,0);if(grid){g.strokeStyle='#222';g.lineWidth=6;g.strokeRect(0,0,w,w)}});
const normalFrom=(c,k)=>{const w=c.width,h=c.height,s=c.getContext('2d').getImageData(0,0,w,h).data,o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d'),d=g.createImageData(w,h),H=(x,y)=>s[(((y+h)%h)*w+((x+w)%w))*4]/255;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(H(x-1,y)-H(x+1,y))*k,dy=(H(x,y-1)-H(x,y+1))*k,l=Math.hypot(dx,dy,1),i=(y*w+x)*4;d.data[i]=(dx/l*.5+.5)*255;d.data[i+1]=(dy/l*.5+.5)*255;d.data[i+2]=(1/l*.5+.5)*255;d.data[i+3]=255}
 g.putImageData(d,0,0);return o};
const T=(c,rep,srgb)=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t};
const pbr=(c,rep,col,k)=>new THREE.MeshStandardMaterial({color:col,map:T(c,rep,1),normalMap:T(normalFrom(c,k),rep),roughnessMap:T(c,rep),roughness:1});

/* ---------- Sky + Lights (sunset) ---------- */
const skyT=new THREE.CanvasTexture(cv(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);[[0,'#1c1430'],[.32,'#5b3a73'],[.47,'#e8804d'],[.5,'#ffb36b'],[.56,'#4a3048'],[1,'#2a1a2a']].forEach(([o,c])=>gr.addColorStop(o,c));g.fillStyle=gr;g.fillRect(0,0,w,h)}));
skyT.mapping=THREE.EquirectangularReflectionMapping;skyT.colorSpace=THREE.SRGBColorSpace;
scene.background=skyT;scene.fog=new THREE.FogExp2(0x4a3048,.008);
scene.add(new THREE.HemisphereLight(0x7a5aa6,0x2a1a1a,.8));
const sun=new THREE.DirectionalLight(0xff9a4d,2.6),sunOff=new V3(-60,20,-40);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{near:1,far:200,left:-70,right:70,top:70,bottom:-70});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;sun.shadow.radius=3;scene.add(sun,sun.target);

/* ---------- City: streets, sidewalks, buildings, lamps ---------- */
const N=4,P=50,C=(i)=>(i-1.5)*P;
const floors=[],boxes=[],lamps=[],bTargets=[];
const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(240,240),pbr(noise(256,200,90),60,0x4a4650,1.5));
asphalt.rotation.x=-Math.PI/2;asphalt.receiveShadow=true;scene.add(asphalt);floors.push(asphalt);
const sideMat=pbr(noise(256,205,50,true),9,0x9a948f,2);
const facade=wall=>{const lit=[],map=cv(128,256,g=>{g.fillStyle=wall;g.fillRect(0,0,128,256);for(let r=0;r<8;r++)for(let c=0;c<4;c++){const on=rnd()<.4;lit.push(on);g.fillStyle=on?'#ffd89a':'#1b1722';g.fillRect(c*32+7,r*32+8,18,18)}}),
 em=cv(128,256,g=>{g.fillStyle='#000';g.fillRect(0,0,128,256);g.fillStyle='#ffb45a';lit.forEach((on,i)=>on&&g.fillRect((i%4)*32+7,((i/4)|0)*32+8,18,18))});
 return new THREE.MeshStandardMaterial({map:T(map,1,1),normalMap:T(normalFrom(map,3),1),roughnessMap:T(map,1),roughness:1,emissive:0xffffff,emissiveMap:T(em,1,1),emissiveIntensity:1.5})};
const bMats=['#7d6b78','#8a7a6a','#6a7088'].map(facade);
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
 const bx=C(i),bz=C(j),slab=new THREE.Mesh(new THREE.BoxGeometry(36,.15,36),sideMat);
 slab.position.set(bx,.075,bz);slab.receiveShadow=true;scene.add(slab);floors.push(slab);
 for(const sx of[-1,1])for(const sz of[-1,1]){
  const w=11+rnd()*2,d=11+rnd()*2,h=12+rnd()*28,g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,us=Math.max(1,Math.round(w/8)),vs=Math.max(1,Math.round(h/16));
  for(let k=0;k<uv.count;k++)uv.setXY(k,uv.getX(k)*us,uv.getY(k)*vs);
  const b=new THREE.Mesh(g,bMats[(rnd()*3)|0]),x=bx+sx*8,z=bz+sz*8;
  b.position.set(x,.15+h/2,z);b.castShadow=b.receiveShadow=true;scene.add(b);bTargets.push(b);boxes.push([x,z,w/2+.5,d/2+.5]);
  lamps.push(new V3(bx+sx*17,.15,bz+sz*17));
 }}
const blocked=(x,z)=>boxes.some(b=>Math.abs(x-b[0])<b[2]&&Math.abs(z-b[1])<b[3]);
/* lane dashes */
const dashes=[],roads=[-P,0,P];
for(const r of roads)for(let t=-96;t<=96;t+=8)if(roads.every(q=>Math.abs(t-q)>9)){dashes.push([r,t,.25,3]);dashes.push([t,r,3,.25])}
const dm=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.02,1),new THREE.MeshStandardMaterial({color:0xe8d9a0,roughness:.8}),dashes.length),mx=new THREE.Matrix4();
dashes.forEach((d,i)=>dm.setMatrixAt(i,mx.compose(new V3(d[0],.012,d[1]),new THREE.Quaternion(),new V3(d[2],1,d[3]))));scene.add(dm);
/* street lamps: emissive bulbs + 6 real lights that follow the player */
const lm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.08,.12,6,8).translate(0,3,0),new THREE.MeshStandardMaterial({color:0x2a2a30,metalness:.6,roughness:.5}),lamps.length);
const lb=new THREE.InstancedMesh(new THREE.SphereGeometry(.35,12,8).translate(0,6.1,0),new THREE.MeshStandardMaterial({color:0x222222,emissive:0xffb060,emissiveIntensity:5}),lamps.length);
lamps.forEach((p,i)=>{mx.makeTranslation(p.x,p.y,p.z);lm.setMatrixAt(i,mx);lb.setMatrixAt(i,mx)});scene.add(lm,lb);
const pool=Array.from({length:6},()=>{const l=new THREE.PointLight(0xffa050,120,24,2);scene.add(l);return l});
const assignLights=()=>{const s=lamps.map(p=>[p.distanceToSquared(rig.position),p]).sort((a,b)=>a[0]-b[0]);pool.forEach((l,i)=>l.position.set(s[i][1].x,6.3,s[i][1].z))};

/* ---------- Dust particles ---------- */
const NP=700,pp=new Float32Array(NP*3);for(let i=0;i<NP;i++){pp[i*3]=(rnd()-.5)*190;pp[i*3+1]=.5+rnd()*24;pp[i*3+2]=(rnd()-.5)*190}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xffc890,size:.12,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false})));

/* ---------- NPCs: AnimationMixer + waypoints (ping-pong) ---------- */
const skinM=new THREE.MeshStandardMaterial({color:0xd2a07e,roughness:.7}),pantsM=new THREE.MeshStandardMaterial({color:0x2b2b38,roughness:.9});
const shirts=[0xc0564b,0x4b7bc0,0x5ba06b,0xd8b04a,0x8a5bb0].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}));
const gB=new THREE.CapsuleGeometry(.22,.5,4,8),gH=new THREE.SphereGeometry(.16,12,8),gL=new THREE.BoxGeometry(.14,.8,.14).translate(0,-.4,0),gA=new THREE.BoxGeometry(.1,.6,.1).translate(0,-.3,0);
const tr=(n,a)=>new THREE.NumberKeyframeTrack(n+'.rotation[x]',[0,.5,1],a);
const walkClip=new THREE.AnimationClip('walk',1,[tr('legL',[.6,-.6,.6]),tr('legR',[-.6,.6,-.6]),tr('armL',[-.5,.5,-.5]),tr('armR',[.5,-.5,.5])]);
const npcs=Array.from({length:24},()=>{
 const g=new THREE.Group(),sh=shirts[(rnd()*5)|0],add=(geo,m,x,y,name)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,0);if(name)o.name=name;o.castShadow=true;g.add(o)};
 add(gB,sh,0,1.15);add(gH,skinM,0,1.72);add(gL,pantsM,-.1,.8,'legL');add(gL,pantsM,.1,.8,'legR');add(gA,sh,-.3,1.4,'armL');add(gA,sh,.3,1.4,'armR');
 const bx=C((rnd()*4)|0),bz=C((rnd()*4)|0),s=rnd()<.5?-15.8:15.8,hz=rnd()<.5;
 const a=hz?new V3(bx-15.8,.15,bz+s):new V3(bx+s,.15,bz-15.8),b=hz?new V3(bx+15.8,.15,bz+s):new V3(bx+s,.15,bz+15.8);
 g.position.lerpVectors(a,b,rnd());scene.add(g);
 const mixer=new THREE.AnimationMixer(g),act=mixer.clipAction(walkClip),sp=1.1+rnd()*.6;act.timeScale=sp/1.2;act.play();
 return{g,mixer,path:[a,b],i:1,dir:1,sp}});

/* ---------- Controls: desktop (drag + WASD) / VR (stick + teleport) ---------- */
const K={};addEventListener('keydown',e=>K[e.code]=1);addEventListener('keyup',e=>K[e.code]=0);
let drag=0,pitch=0,snap=1;const el=R.domElement;
el.addEventListener('pointerdown',e=>{drag=1;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointerup',()=>drag=0);
el.addEventListener('pointermove',e=>{if(!drag||R.xr.isPresenting)return;rig.rotation.y-=e.movementX*.004;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.004));cam.rotation.x=pitch});
const fw=new V3(),rt=new V3();
function walk(f,s){cam.getWorldDirection(fw);fw.y=0;if(fw.lengthSq()<1e-6)return;fw.normalize();rt.crossVectors(fw,UP);const dx=fw.x*f+rt.x*s,dz=fw.z*f+rt.z*s,p=rig.position;if(!blocked(p.x+dx,p.z))p.x+=dx;if(!blocked(p.x,p.z+dz))p.z+=dz}
function turn(a){const h=cam.getWorldPosition(new V3());rig.position.sub(h).applyAxisAngle(UP,a).add(h);rig.rotation.y+=a}
const marker=new THREE.Mesh(new THREE.RingGeometry(.25,.35,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffd9a0,toneMapped:false}));marker.visible=false;scene.add(marker);
const ray=new THREE.Raycaster(),ro=new V3(),rd=new V3(),rq=new THREE.Quaternion(),targets=[...floors,...bTargets];ray.far=25;
const ctrls=[0,1].map(i=>{const c=R.xr.getController(i);rig.add(c);
 c.add(new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.12),new THREE.MeshStandardMaterial({color:0x444450})));
 const laser=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(),new V3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xffd9a0,toneMapped:false}));laser.visible=false;c.add(laser);c.userData.laser=laser;
 c.addEventListener('connected',e=>c.userData.src=e.data);
 c.addEventListener('selectstart',()=>c.userData.aim=1);
 c.addEventListener('selectend',()=>{const h=c.userData.hit;c.userData.aim=0;laser.visible=marker.visible=false;c.userData.hit=null;
  if(h){const hd=cam.getWorldPosition(new V3());rig.position.set(rig.position.x+h.x-hd.x,h.y,rig.position.z+h.z-hd.z)}});
 return c});
R.xr.addEventListener('sessionstart',()=>document.getElementById('hint').style.display='none');
R.xr.addEventListener('sessionend',()=>{document.getElementById('hint').style.display='block';cam.position.set(0,1.6,0);cam.rotation.set(0,0,0);pitch=0;rig.position.y=0});

/* ---------- Post-processing (desktop only: bloom does not work inside WebXR) ---------- */
const comp=new EffectComposer(R);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.5,.85));comp.addPass(new OutputPass());
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight)});

/* ---------- Main loop ---------- */
const clock=new THREE.Clock();let lampT=0;
R.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,vr=R.xr.isPresenting;
 if(!vr){const f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),s=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
  if(f||s){const k=(K.ShiftLeft?8:4)*dt/Math.hypot(f,s);walk(f*k,s*k)}}
 else for(const c of ctrls){const src=c.userData.src,a=src?.gamepad?.axes;
  if(a&&a.length>3){const x=Math.abs(a[2])>.15?a[2]:0,y=Math.abs(a[3])>.15?a[3]:0;
   if(src.handedness==='left'&&(x||y))walk(-y*3*dt,x*3*dt);
   else if(src.handedness==='right'){if(Math.abs(x)>.7&&snap){turn(x>0?-.52:.52);snap=0}else if(Math.abs(x)<.3)snap=1}}
  if(c.userData.aim){c.getWorldPosition(ro);c.getWorldQuaternion(rq);rd.set(0,0,-1).applyQuaternion(rq);ray.set(ro,rd);
   const h=ray.intersectObjects(targets,false)[0],ok=h&&floors.includes(h.object)&&!blocked(h.point.x,h.point.z);
   c.userData.laser.visible=true;c.userData.laser.scale.z=h?h.distance:10;c.userData.hit=ok?h.point.clone():null;
   marker.visible=!!ok;if(ok)marker.position.copy(h.point).y+=.03}}
 sun.position.copy(rig.position).add(sunOff);sun.target.position.copy(rig.position);
 if((lampT-=dt)<0){lampT=.4;assignLights()}
 const p=pg.attributes.position.array;for(let i=0;i<NP;i++){p[i*3]+=dt*.3;p[i*3+1]+=Math.sin(t*.7+i)*.004;if(p[i*3]>95)p[i*3]=-95}pg.attributes.position.needsUpdate=true;
 for(const n of npcs){n.mixer.update(dt);const q=n.path[n.i],dx=q.x-n.g.position.x,dz=q.z-n.g.position.z,d=Math.hypot(dx,dz);
  if(d<.15){n.i+=n.dir;if(n.i<0||n.i>1){n.dir*=-1;n.i+=2*n.dir}}else{n.g.position.x+=dx/d*n.sp*dt;n.g.position.z+=dz/d*n.sp*dt;n.g.rotation.y=Math.atan2(dx,dz)}}
 vr?R.render(scene,cam):comp.render();
});
</script>
</body>
</html>
